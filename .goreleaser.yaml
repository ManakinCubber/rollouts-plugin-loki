version: 2
project_name: rollouts-loki-plugin
before:
  hooks:
    - go mod tidy
    - go test ./...
builds:
  - binary: loki-plugin
    main: ./main.go
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w

git:
  tag_sort: -version:creatordate

release:
  prerelease: auto

universal_binaries:
  - replace: true

checksum:
  name_template: "checksums.txt"